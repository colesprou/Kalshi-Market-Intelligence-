services:
  - type: web
    name: kalshi-research-api
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kalshi-research-db
          property: connectionString
      - key: ENVIRONMENT
        value: prod
      - key: CORS_ORIGINS
        value: https://kalshi-research-ui.onrender.com
      - key: KALSHI_SERIES_PREFIXES
        value: KXMLBGAME
      - key: POLLING_LEAGUES
        value: mlb
      - key: POLLING_MARKETS
        value: Moneyline,Run Line,Total Runs,1st Half Total Runs
      - key: SHARP_BOOKS
        value: Pinnacle,Circa Sports,BetOnline,Betcris
      - key: OPTIC_DISCOVERY_CONCURRENCY
        value: 8
      - key: KALSHI_PRIVATE_DATA_ENABLED
        value: "false"
      - key: FAST_POLL_ENABLED
        value: "false"
      - key: KALSHI_API_KEY
        sync: false
      - key: KALSHI_PRIVATE_KEY
        sync: false
      - key: ODDSJAM_API_KEY
        sync: false

  - type: worker
    name: kalshi-research-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker run
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kalshi-research-db
          property: connectionString
      - key: ENVIRONMENT
        value: prod
      - key: KALSHI_SERIES_PREFIXES
        value: KXMLBGAME
      - key: POLLING_LEAGUES
        value: mlb
      - key: POLLING_MARKETS
        value: Moneyline,Run Line,Total Runs,1st Half Total Runs
      - key: SHARP_BOOKS
        value: Pinnacle,Circa Sports,BetOnline,Betcris
      - key: OPTIC_DISCOVERY_CONCURRENCY
        value: 8
      - key: KALSHI_TRADES_INTERVAL_SECONDS
        value: 60
      - key: PRIVATE_FILLS_INTERVAL_SECONDS
        value: 300
      - key: FEATURE_BUCKET_INTERVAL_SECONDS
        value: 60
      - key: FEATURE_BUCKET_LOOKBACK_MINUTES
        value: 3
      - key: EVENT_DETECTION_INTERVAL_SECONDS
        value: 60
      - key: KALSHI_PRIVATE_DATA_ENABLED
        value: "false"
      - key: FAST_POLL_ENABLED
        value: "false"
      - key: FAST_POLL_INTERVAL_SECONDS
        value: 5
      - key: FAST_POLL_MARKET_LIMIT
        value: 20
      - key: FAST_POLL_WINDOW_MINUTES
        value: 15
      - key: KALSHI_API_KEY
        sync: false
      - key: KALSHI_PRIVATE_KEY
        sync: false
      - key: ODDSJAM_API_KEY
        sync: false

  - type: web
    name: kalshi-research-ui
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kalshi-research-api.onrender.com

databases:
  - name: kalshi-research-db
    databaseName: kalshi_research
    user: kalshi_research
